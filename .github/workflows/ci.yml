name: CI

on:
  push:
    branches: [main, develop, feature/v0.3.0]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build-type: Debug
            coverage: true
          - compiler: gcc
            build-type: Release
            coverage: false
          - compiler: clang
            build-type: Release
            coverage: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GCC compiler
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Set Clang compiler
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcovr ccache

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ matrix.compiler }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.compiler }}-

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', '*/CMakeLists.txt') }}
          restore-keys: |
            deps-linux-${{ matrix.compiler }}-

      - name: Configure
        run: |
          CXX_FLAGS=""
          if [ "${{ matrix.coverage }}" = "true" ]; then
            CXX_FLAGS="--coverage -g -O0"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_FLAGS="${CXX_FLAGS}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report
        if: matrix.coverage
        run: |
          gcovr \
            --root . \
            --exclude '.*CMakeFiles/.*' \
            --exclude '.*CompilerIdCXX.*' \
            --exclude '.*CompilerIdC.*' \
            --exclude '.*cmake/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*_deps/.*' \
            --exclude '.*/demo/.*' \
            --gcov-ignore-parse-errors=all \
            --html-details coverage.html \
            --print-summary

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.compiler }}
          path: coverage*.html

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang clang-tidy ccache

      - name: Configure ccache
        run: |
          ccache --max-size=500M
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-clang-tidy-${{ github.run_id }}
          restore-keys: |
            ccache-linux-clang-tidy-

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-clang-tidy-${{ hashFiles('CMakeLists.txt', '*/CMakeLists.txt') }}
          restore-keys: |
            deps-linux-clang-tidy-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -G Ninja
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build build

      - name: clang-tidy
        run: |
          if [ -f build/compile_commands.json ]; then
            clang-tidy -p build --warnings-as-errors='*' \
              $(find microservice-core/include microservice-core/src microservice-boost/include microservice-boost/src \
                -name '*.cpp' -o -name '*.hpp' | grep -v '_deps' | grep -v 'build') 2>&1 | tee tidy.log
            if grep -qE ':(error|warning):' tidy.log; then
              echo "::error::clang-tidy found issues"
              exit 1
            fi
          else
            echo "No compile_commands.json found, skipping clang-tidy"
          fi